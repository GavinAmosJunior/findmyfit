name: Android APK

# Builds an APK to hand to Android testers, on GitHub's machines, when
# started by hand (Actions tab › Android APK › Run workflow, or
# `gh workflow run apk.yml`). The file is attached to the run.
on:
  workflow_dispatch:

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Build
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: FindMyFit-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
