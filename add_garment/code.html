unded-xl text-on-surface-variant font-label-md text-label-md font-medium transition-all" id="statusHamperBtn" type="button"><span class="material-symbols-outlined text-[18px]">shopping_basket</span><span class="">In Hamper (Dirty)</span></button></div></div><!-- Primary Action: Save Garment --><div class="pt-space-xs"><button class="w-full h-14 rounded-full bg-primary text-on-primary font-title-sm text-title-sm font-bold flex items-center justify-center space-x-2 shadow-[0_8px_20px_-4px_rgba(0,88,190,0.35)] active:scale-[0.98] transition-transform" id="saveGarmentBtn" type="button"><span class="material-symbols-outlined text-[22px]">check</span><span class="">Save Garment</span></button></div></div></div>
<script>
  (function () {
    // Shutter Trigger Tactile Flash micro-interaction
    const shutterBtn = document.getElementById('shutterBtn');
    const shutterInner = document.getElementById('shutterInner');
    const viewfinder = document.getElementById('viewfinderFeed');
    const flashBtn = document.getElementById('flashToggle');
    let flashOn = false;

    if (shutterBtn && shutterInner && viewfinder) {
      shutterBtn.addEventListener('click', function () {
        shutterInner.classList.add('scale-75', 'bg-secondary');
        viewfinder.classList.add('brightness-150');
        setTimeout(function () {
          shutterInner.classList.remove('scale-75', 'bg-secondary');
          viewfinder.classList.remove('brightness-150');
        }, 150);
      });
    }

    // Flash toggle button
    if (flashBtn) {
      flashBtn.addEventListener('click', function () {
        flashOn = !flashOn;
        const icon = flashBtn.querySelector('.material-symbols-outlined');
        if (flashOn) {
          flashBtn.classList.replace('text-on-surface-variant', 'text-tertiary-container');
          flashBtn.classList.add('bg-tertiary-fixed');
          if (icon) icon.textContent = 'flash_on';
        } else {
          flashBtn.classList.replace('text-tertiary-container', 'text-on-surface-variant');
          flashBtn.classList.remove('bg-tertiary-fixed');
          if (icon) icon.textContent = 'flash_off';
        }
      });
    }

    // Flip Camera button animation
    const flipCam = document.getElementById('flipCamToggle');
    if (flipCam) {
      flipCam.addEventListener('click', function () {
        const icon = flipCam.querySelector('.material-symbols-outlined');
        if (icon) {
          icon.classList.add('rotate-180', 'transition-transform', 'duration-300');
          setTimeout(() => icon.classList.remove('rotate-180'), 300);
        }
      });
    }

    // Category Selector selection
    const categoryChips = document.querySelectorAll('.category-chip');
    categoryChips.forEach(chip => {
      chip.addEventListener('click', function () {
        categoryChips.forEach(c => {
          c.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm');
          c.classList.add('bg-surface-container-low', 'text-on-surface');
          const lbl = c.querySelector('span:last-child');
          if (lbl) {
            lbl.classList.remove('font-semibold');
            lbl.classList.add('font-medium');
          }
        });
        this.classList.remove('bg-surface-container-low', 'text-on-surface');
        this.classList.add('bg-primary', 'text-on-primary', 'shadow-sm');
        const activeLbl = this.querySelector('span:last-child');
        if (activeLbl) {
          activeLbl.classList.remove('font-medium');
          activeLbl.classList.add('font-semibold');
        }
      });
    });

    // Wardrobe status switcher (In Closet vs In Hamper)
    const closetBtn = document.getElementById('statusClosetBtn');
    const hamperBtn = document.getElementById('statusHamperBtn');

    if (closetBtn && hamperBtn) {
      closetBtn.addEventListener('click', function () {
        closetBtn.className = "flex items-center justify-center space-x-2 py-2.5 px-3 rounded-xl bg-surface-container-lowest text-secondary shadow-sm font-label-md text-label-md font-bold transition-all";
        hamperBtn.className = "flex items-center justify-center space-x-2 py-2.5 px-3 rounded-xl text-on-surface-variant font-label-md text-label-md font-medium transition-all";
      });

      hamperBtn.addEventListener('click', function () {
        hamperBtn.className = "flex items-center justify-center space-x-2 py-2.5 px-3 rounded-xl bg-surface-container-lowest text-tertiary shadow-sm font-label-md text-label-md font-bold transition-all";
        closetBtn.className = "flex items-center justify-center space-x-2 py-2.5 px-3 rounded-xl text-on-surface-variant font-label-md text-label-md font-medium transition-all";
      });
    }

    // Save To Wardrobe Toast Animation
    const saveBtn = document.getElementById('saveGarmentBtn');
    const saveToast = document.getElementById('saveToast');

    if (saveBtn && saveToast) {
      saveBtn.addEventListener('click', function () {
        saveToast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
        saveToast.classList.add('opacity-100', 'translate-y-0');
        setTimeout(() => {
          saveToast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
          saveToast.classList.remove('opacity-100', 'translate-y-0');
        }, 2600);
      });
    }
  })();
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface/85 backdrop-blur-2xl shadow-[0_-1px_12px_rgba(0,0,0,0.04)]" data-active-classes="text-primary font-semibold"><div class="flex justify-around items-center h-16 px-space-xs"><a class="flex flex-col items-center justify-center gap-0.5 min-w-[64px] h-12 text-on-surface-variant relative transition-transform active:scale-95" data-path="wardrobe" href="#"><span class="material-symbols-outlined text-[24px]">checkroom</span><span class="font-label-sm text-label-sm">Wardrobe</span></a><a class="flex flex-col items-center justify-center gap-0.5 min-w-[64px] h-12 text-on-surface-variant relative transition-transform active:scale-95" data-path="hamper" href="#"><span class="relative"><span class="material-symbols-outlined text-[24px]">shopping_basket</span><span class="absolute -top-1 -right-2 bg-primary text-on-primary font-label-sm text-[10px] h-4 min-w-[16px] px-1 rounded-full flex items-center justify-center font-bold">5</span></span><span class="font-label-sm text-label-sm">Hamper</span></a><a class="flex flex-col items-center justify-center gap-0.5 min-w-[64px] h-12 text-on-surface-variant transition-transform active:scale-95" data-path="at-laundry" href="#"><span class="material-symbols-outlined text-[24px]">save_as</span><span class="font-label-sm text-label-sm">At Laundry</span></a><a class="flex flex-col items-center justify-center gap-0.5 min-w-[64px] h-12 text-on-surface-variant transition-transform active:scale-95" data-path="lost-and-found" href="#"><span class="material-symbols-outlined text-[24px]">manage_search</span><span class="font-label-sm text-label-sm">Lost &amp; Found</span></a></div></nav>
